# Settings shared by the API and the worker
x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/wallet
  DB_USERNAME: wallet
  DB_PASSWORD: wallet
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}

services:
  postgres:
    image: postgres:16
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5433:5432"
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: wallet-ledger:local
    container_name: wallet-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_ENABLED: "false"
    ports:
      - "8080:8080"

  worker:
    build: .
    image: wallet-ledger:local
    container_name: wallet-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none   # no HTTP server in the worker
      RECONCILIATION_CRON: ${RECONCILIATION_CRON:-0 0 2 * * *}

volumes:
  wallet-pgdata: