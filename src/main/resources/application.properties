spring.application.name=wallet-ledger

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wallet}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:wallet}

spring.flyway.locations=classpath:db/migration

spring.jackson.property-naming-strategy=SNAKE_CASE

# Background worker: runs the nightly job (true locally; false in the API container)
worker.enabled=${WORKER_ENABLED:true}

# Nightly job: 2 AM India time (second minute hour day month weekday)
reconciliation.cron=${RECONCILIATION_CRON:0 0 2 * * *}
reconciliation.zone=Asia/Kolkata

# LLM provider: mock (default, no network) or openai-compatible (e.g. Groq free tier)
llm.provider=${LLM_PROVIDER:mock}
llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:openai/gpt-oss-20b}