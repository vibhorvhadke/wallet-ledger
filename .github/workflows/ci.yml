name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Unit and integration tests, against real PostgreSQL 16 via Testcontainers:
      # stampede, idempotency, reconciliation, fraud rules, statement Q&A and prompt injection
      - name: Run all tests
        run: ./mvnw -B verify

      - name: Build the Docker image
        run: docker build -t wallet-ledger:ci .

      - name: Upload test reports if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/